# Salve este arquivo no repositório como: .github/workflows/extrair-zip.yml
#
# Como usar:
#   1. Envie um .zip para a RAIZ do repositório (Add file -> Upload files).
#   2. O workflow extrai tudo na raiz, apaga o .zip e faz commit.
#   3. Se existir .github/workflows/android.yml, ele dispara o build do APK.
#
# Observação: com o token padrão, o GitHub NÃO deixa o Actions criar/alterar
# arquivos em .github/workflows. Por isso, sem o segredo PAT_TOKEN, essa pasta é
# ignorada na extração (cole esses arquivos à mão pelo editor do GitHub).
# Com um segredo PAT_TOKEN (token pessoal com permissão "workflow"), tudo é extraído.

name: Extrair ZIP

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: extrair-zip
  cancel-in-progress: false

jobs:
  extrair:
    runs-on: ubuntu-latest
    env:
      HAS_PAT: ${{ secrets.PAT_TOKEN != '' }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Extrair os .zip da raiz
        id: extrair
        run: |
          shopt -s nullglob
          zips=(./*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Nenhum .zip na raiz."
            echo "achou=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for z in "${zips[@]}"; do
            echo "==> Extraindo $z"
            if [ "$HAS_PAT" = "true" ]; then
              unzip -o -q "$z"
            else
              if unzip -Z1 "$z" | grep -q '^\.github/workflows/'; then
                echo "::warning::$z tem arquivos em .github/workflows; foram pulados (cole à mão ou crie o segredo PAT_TOKEN)."
              fi
              unzip -o -q "$z" -x ".github/workflows/*"
            fi
            rm -f "$z"
          done
          echo "achou=true" >> "$GITHUB_OUTPUT"

      - name: Commit e push
        if: steps.extrair.outputs.achou == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git commit -m "Extrai zip enviado"
          git push

      - name: Disparar o build do Android
        if: steps.extrair.outputs.achou == 'true' && env.HAS_PAT != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .github/workflows/android.yml ]; then
            gh workflow run android.yml --ref "$GITHUB_REF_NAME"
          else
            echo "android.yml ainda não existe; crie-o e rode o build manualmente."
          fi
